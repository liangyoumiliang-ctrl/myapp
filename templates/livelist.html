<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>Live List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesheets/livelist.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesheets/thema.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='stylesheets/header.css') }}">
  </head>

  <body>
    <header class="header-nav">

      <div class="header-left">
        <a href="{{ url_for('home') }}" class="header-logo">
          <img
      src="{{ url_for('static', filename='images/Re_Live.png') }}"
      alt="Re:Live"
    >
        </a>
      </div>
    
      <nav class="header-center">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('livelist') }}">Live List</a>
        <a href="{{ url_for('history') }}">History</a>
      </nav>
    
      <div class="header-right">
        <button type="button" id="theme-toggle"></button>
        <div class="login-area">
        {% if user %}
          <div class="user-menu">
            <button type="button" class="user-menu-button" id="user-menu-button">
              {{ user.display_name }}
              <span class="menu-arrow">⬇︎</span>
            </button>

            <div class="user-dropdown" id="user-dropdown">
              <div class="user-info">
                <span>{{ user.display_name }}</span>
                <small>{{ user.email }}</small>
              </div>
              <a href="{{ url_for('login_change') }}">Account Change</a>
              <a href="{{ url_for('logout') }}">Logout</a>
            </div>
          </div>
        {% else %}
          <a href="{{ url_for('login') }}">Login </a>
        {% endif %}
        </div>
      </div>
    
    </header>
    <div class="live-list-page">
      <div class="page-header">
        <div class="content">
          <p>LIVE SCHEDULE</p>
          <h1>ライブ一覧</h1>
          <p class="page-description">
            登録したライブ予定を確認・管理できます。
          </p>
        </div>
        <div class="content_button">
          <br>
          {% if user %}
          <a href="{{ url_for('addlive')}}" class="button add">
            Add Live
          </a>
          {% endif %}
        </div>

      <section class="live-list">
        <h1>Next Live</h1>

      </section>
      

    <div id="live-list"></div>
    <div id="countdown"></div>

      </div>
    </div>

    <script src="{{ url_for('static', filename='javascript/livelist.js') }}" defer></script>
    <script src="{{ url_for('static', filename='javascript/thema.js') }}" defer></script>
    <script src="{{ url_for('static', filename='javascript/header.js') }}" defer></script>

    <footer>
      <small>© 2026 Re:Live All Rights Reserved.</small>
    </footer>

  </body>
</html>

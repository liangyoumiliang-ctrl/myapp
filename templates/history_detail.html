<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ライブ詳細</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='stylesheets/history_detail.css') }}"
  >
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='stylesheets/thema.css') }}">
</head>

<body data-live-id="{{ live_id }}">
  <header class="header-nav">
    <div class="colorchange">
      <nav><a href="#" id="theme-toggle">Light/Dark</a></nav>
    </div>
    <nav><a href="{{ url_for('home') }}">Home</a></nav>
    <nav><a href="{{ url_for('livelist') }}">Live List</a></nav>
    <nav><a href="{{ url_for('history') }}">History</a></nav>
  </header>

  <main class="history-detail-page">
    <div class="content">
      <p>LIVE REMINISCE</p>
      <h1>ライブ履歴詳細</h1>
      <p>ライブの思い出を振り返ろう</p>
    </div>
 
    <div class="twopage">
    <div class="live-card">
    <section id="live-detail"></section>
    <br>

    <section class="setlist-section">
      <div class="setlist-header">
        <h2>Setlist</h2>
        <button type="button" id="edit-button">編集</button>
    </div>

      <form id="setlist-form">
        <input
          type="text"
          id="song-title"
          placeholder="曲名を入力"
          required
        >

        <button type="submit" class="add_music">
          + 追加
        </button>
      </form>

      <div class="setlist_area">
      <ol id="setlist-list"></ol>
    </div>
    </section>
    <br>

    <section class="memo-section">
      <h2>Memo</h2>

      <textarea
        id="live-memo"
        placeholder="ライブの感想を入力"
      ></textarea>

      <button
        type="button"
        id="save-memo-button">
        保存
      </button>
    </section>
    </div>
    <section class="photo-section">
        <h2>Photos</h2>
      
        <label for="photo-input" class="photo-add-button">
          <span class="camera-icon">📷</span>
          <span>＋ 写真を追加</span>
        </label>
      
        <input
          type="file"
          id="photo-input"
          accept="image/*"
          multiple
        >
      
        <div id="photo-gallery"></div>
      </section>
    </div>
  </main>
  <div id="photo-modal" class="photo-modal">
    <button
    id="photo-prev"
    class="photo-arrow left">
    ❮
  </button>
  
    <img
      id="photo-modal-image"
      class="photo-modal-image"
      src=""
      alt="拡大写真"
    >

    <button
    id="photo-next"
    class="photo-arrow right">
    ❯
  </button>
  <span id="photo-modal-close" class="photo-modal-close">
    ×
  </span>
  <div id="photo-counter"></div>

  </div>

  <script
    src="{{ url_for('static', filename='javascript/history_detail.js') }}"
    defer>
  </script>
  <script src="{{ url_for('static', filename='javascript/thema.js') }}" defer></script>
  <footer>
    <small>© 2020 米良諒祐 All Rights Reserved.</small>
 </footer>
</body>
</html>

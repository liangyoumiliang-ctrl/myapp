<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    名前設定 | Re:Live
  </title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='stylesheets/base.css') }}"
  >

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='stylesheets/thema.css') }}"
  >

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='stylesheets/header.css') }}"
  >

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='stylesheets/set_name.css') }}"
  >

</head>


<body>

  <header>

    <div class="header-nav">

      <div class="header-left">

        <a
          href="{{ url_for('home') }}"
          class="header-logo"
        >

          <img
            src="{{ url_for('static', filename='images/Re_Live.png') }}"
            alt="Re:Live"
          >

        </a>

      </div>


      <nav class="header-center">

        <a href="{{ url_for('home') }}">
          Home
        </a>

        <a href="{{ url_for('livelist') }}">
          Live List
        </a>

        <a href="{{ url_for('history') }}">
          History
        </a>

      </nav>


      <div class="header-right">

        <a
          href="#"
          id="theme-toggle"
        >
          A
        </a>

        <div class="login-area">

          {% if user %}

            <div class="user-menu">

              <button
                type="button"
                class="user-menu-button"
                id="user-menu-button"
              >
                {{ user.display_name }}

                <span class="menu-arrow">
                  ⬇︎
                </span>

              </button>


              <div
                class="user-dropdown"
                id="user-dropdown"
              >

                <div class="user-info">

                  <span>
                    {{ user.display_name }}
                  </span>

                  <small>
                    {{ user.email }}
                  </small>

                </div>

                <a href="{{ url_for('login_change') }}">
                  Account Change
                </a>

                <a href="{{ url_for('logout') }}">
                  Logout
                </a>

              </div>

            </div>

          {% else %}

            <a href="{{ url_for('login') }}">
              Login
            </a>

          {% endif %}

        </div>

      </div>

    </div>

  </header>


  <main>

    <div class="mainpage">

      <section class="name-setting">

        <div class="name-card">

          <p class="eyebrow">
            WELCOME TO RE:LIVE
          </p>

          <h1>
            What should we call you?
          </h1>

          <p class="name-description">
            Re:Liveで表示する名前を入力してください。
          </p>


          <form method="POST">

            <input
              type="text"
              name="display_name"
              placeholder="NAME"
              maxlength="30"
              required
            >

            <button type="submit">
              Continue →
            </button>

          </form>

        </div>

      </section>

    </div>

  </main>


  <footer>

    <p>
      © 2026 Re:Live All Rights Reserved.
    </p>

  </footer>


  <script
    src="{{ url_for('static', filename='javascript/thema.js') }}"
    defer
  ></script>

  <script
    src="{{ url_for('static', filename='javascript/header.js') }}"
    defer
  ></script>


  <script>

    const userMenuButton =
      document.getElementById("user-menu-button");

    const userDropdown =
      document.getElementById("user-dropdown");


    if (userMenuButton && userDropdown) {

      userMenuButton.addEventListener(
        "click",
        (event) => {

          event.stopPropagation();

          userDropdown.classList.toggle("open");

        }
      );


      document.addEventListener(
        "click",
        () => {

          userDropdown.classList.remove("open");

        }
      );


      userDropdown.addEventListener(
        "click",
        (event) => {

          event.stopPropagation();

        }
      );

    }

  </script>

</body>

</html>
